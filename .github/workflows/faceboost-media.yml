name: Faceboost scoped media 2.18.14
on:
  push:
    branches: [arena/f8d9a96b-goldbook]
    paths:
      - 'integrations/faceboost-2.18.14/**'
      - '.github/workflows/faceboost-media.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faceboost-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the pinned NEW project (not goldbook application sources)
        run: |
          mkdir -p work/faceboost
          curl --fail --location --retry 3 https://codeload.github.com/abdulrahmanalmikhlafi736-cmd/faceboost-review/tar.gz/fe8a474b25414b38819b7cf927720899c8c89705 | tar -xz --strip-components=1 -C work/faceboost
          python3 integrations/faceboost-2.18.14/apply.py work/faceboost
      - name: DOM and production-gesture integration gate
        run: |
          npm install --prefix "$RUNNER_TEMP/harness" --no-audit --no-fund jsdom@26.1.0
          FACEBOOST_SOURCE="$PWD/work/faceboost" JSDOM_PATH="$RUNNER_TEMP/harness/node_modules/jsdom" node --test integrations/faceboost-2.18.14/*.test.cjs | tee media-dom-results.tap
      - name: Build release and fixture APKs with unchanged identity and signing
        working-directory: work/faceboost
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace 2>&1 | tee "$RUNNER_TEMP/fpro-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 -c 'import os,pathlib; lines=pathlib.Path(os.environ["RUNNER_TEMP"]+"/fpro-build.log").read_text().splitlines(); text="\n".join(x for x in lines if x.startswith("e:") or "error:" in x.lower() or "What went wrong" in x or "Execution failed" in x or "Could not" in x)[:8000]; print("::error title=FPRO build diagnostics::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit "$result"
          fi
      - name: Package APK candidate and exact patched source
        run: |
          mkdir -p artifacts
          cp work/faceboost/app/build/outputs/apk/release/app-release.apk artifacts/FPRO-2.18.14-media-candidate.apk
          cp work/faceboost/app/build/outputs/apk/debug/app-debug.apk artifacts/fixture-app.apk
          cp work/faceboost/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/fixture-tests.apk
          cp media-dom-results.tap artifacts/
          tar --exclude='./.gradle' --exclude='./.kotlin' --exclude='./build' --exclude='./app/build' --exclude='./local.properties' -czf artifacts/FPRO-2.18.14-source.tar.gz -C work/faceboost .
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Faceboost-2.18.14-build-inputs
          path: artifacts/
          if-no-files-found: error
  chromium-fixtures:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Faceboost-2.18.14-build-inputs
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run twenty-two WebView and settings regressions on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install artifacts/fixture-app.apk
            adb install artifacts/fixture-tests.apk
            adb shell am instrument -w -r -e class com.almekhlafi.materialbook.ui.screens.MediaSurfaceRegressionTest,com.almekhlafi.materialbook.ui.screens.HomeSwipeSettingUiTest com.almekhlafi.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            if ! grep -F 'OK (22 tests)' instrumentation.txt; then python3 -c 'import pathlib; text=pathlib.Path("instrumentation.txt").read_text(); marker="INSTRUMENTATION_RESULT: stream="; text=(text[text.rfind(marker):] if marker in text else text[-3500:])[:3500]; print("::error title=FPRO fixture diagnostics::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; exit 1; fi
            if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' instrumentation.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Faceboost-2.18.14-Chromium-evidence
          path: instrumentation.txt
          if-no-files-found: warn
  candidate:
    needs: [build, chromium-fixtures]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Faceboost-2.18.14-build-inputs
          path: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: FPRO-2.18.14-media-candidate
          path: |
            artifacts/FPRO-2.18.14-media-candidate.apk
            artifacts/SHA256SUMS.txt
            artifacts/media-dom-results.tap
          if-no-files-found: error
