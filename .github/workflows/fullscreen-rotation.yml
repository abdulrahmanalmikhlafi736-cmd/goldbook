name: Fullscreen video rotation
on:
  push:
    paths: ['app/src/main/assets/facebook.js', 'app/src/main/java/com/almekhlafi/FPRO/MainActivity.kt', 'app/src/main/java/com/almekhlafi/FPRO/FullscreenRotationGate.kt', 'app/src/androidTest/java/com/almekhlafi/FPRO/FullscreenRotationRegressionTest.kt', '.github/workflows/fullscreen-rotation.yml']
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.almekhlafi.FPRO.FullscreenRotationRegressionTest --stacktrace
      - name: Publish exact test result
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          seen=[]
          for p in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
            for c in ET.parse(p).iter('testcase'):
              if c.get('name')!='doubleTapPlayerSurvivesLandscapeAndBackRestoresBrowsing': continue
              ok=not any(c.find(k) is not None for k in ('failure','error','skipped'))
              seen.append(ok)
              print('::notice::'+('PASS' if ok else 'FAIL'))
              if not ok: print('::error::'+ET.tostring(c,encoding='unicode')[:7000].replace('%','%25').replace('\n','%0A'))
          assert len(seen)==1 and all(seen), 'Actual fullscreen rotation did not pass'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-rotation-API${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
