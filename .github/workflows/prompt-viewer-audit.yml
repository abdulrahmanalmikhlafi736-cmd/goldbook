name: Back media and session safety
on:
  push:
    paths: ['app/src/main/assets/app-prompt-engine.js', 'app/src/main/java/com/almekhlafi/FPRO/MainActivity.kt', 'app/src/main/java/com/almekhlafi/FPRO/WebViewStateSnapshot.kt', 'app/src/androidTest/java/com/almekhlafi/FPRO/BackAndSessionRegressionTest.kt', 'app/src/androidTest/java/com/almekhlafi/FPRO/PromptViewerAuditTest.kt', '.github/workflows/prompt-viewer-audit.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.almekhlafi.FPRO.PromptViewerAuditTest,com.almekhlafi.FPRO.BackAndSessionRegressionTest,com.almekhlafi.FPRO.FeedReturnRegressionTest,com.almekhlafi.FPRO.VideoColorWorkloadTest,com.almekhlafi.FPRO.WebViewRenderingTest#zzPictureInPictureUsesRealPlaybackAndHome --stacktrace
            adb logcat -d -v brief -s FPRO_PROMPT_VIEWER:I '*:S' > prompt-viewer-audit-device.log
      - name: Publish native assertions
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          seen=[]
          for p in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              for c in ET.parse(p).iter('testcase'):
                  if c.get('name') not in ('promptFilterPreservesLargeShadowMediaOwnerAndHidesActualCta','messagesUsesExistingHistoryInsteadOfReloadingHome','blockedRendererBackTimesOutOnceAndLateCallbackCannotNavigateAgain','boundedStateRestoresHistoryWithoutChangingLiveHistory','nativeBackClosesSiteDialogWithoutNavigatingHistory','openedPostKeepsViewportOffsetAfterNativeBackAndLateLayout','nativeBackDoesNotConsumeFirstPressScrollingDetailToTop','siteArrowRestoresPostWhenReplacingHomeTrackingRoute','collapsedSourcePostRemainsVisibleInsteadOfRestoringImpossibleOffset','decodedVideoAndClockDoNotRescanUnrelatedColors','zzPictureInPictureUsesRealPlaybackAndHome'): continue
                  ok=not any(c.find(k) is not None for k in ('failure','error','skipped'))
                  seen.append(ok)
                  print('::notice title=Back and media regression::'+c.get('name')+': '+('SAFETY REGRESSION PASS (offline fixture)' if ok else 'AUDIT FAILED'))
                  if not ok: print('::error::'+ET.tostring(c,encoding='unicode')[:6500].replace('%','%25').replace('\n','%0A'))
          log=Path('prompt-viewer-audit-device.log')
          if log.exists():
              for line in log.read_text().splitlines():
                  if 'FPRO_PROMPT_VIEWER' in line: print('::notice title=Prompt viewer evidence::'+line.replace('%','%25'))
          assert len(seen)==11 and all(seen), 'Missing/failed/skipped native evidence'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-viewer-audit-android13-evidence
          path: |
            prompt-viewer-audit-device.log
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
