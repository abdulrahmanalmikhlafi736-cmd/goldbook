name: WebView device regression
on: [push, workflow_dispatch]
jobs:
  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Collect device diagnostics
        if: always()
        run: |
          mkdir -p device-diagnostics
          adb logcat -d > device-diagnostics/logcat.txt || true
          adb pull /sdcard/Android/data/com.almekhlafi.FPRO/files/ device-diagnostics/ || true
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              for failure in ET.parse(report).iter('failure'):
                  message = (failure.get('message') or failure.text or 'Device test failed').splitlines()[0]
                  print('::error::' + message.replace('%','%25'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview-device-diagnostics
          path: |
            device-diagnostics/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
