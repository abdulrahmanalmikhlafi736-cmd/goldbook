name: FPRO settings UI diagnosis
on:
  push:
    branches: [arena/f8d9a96b-goldbook]
    paths: ['.github/workflows/faceboost-settings-diagnosis.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42432809615
          name: Faceboost-2.18.10-build-inputs
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install artifacts/fixture-app.apk
            adb install artifacts/fixture-tests.apk
            adb shell am instrument -w -r -e class com.almekhlafi.materialbook.ui.screens.HomeSwipeSettingUiTest com.almekhlafi.test/androidx.test.runner.AndroidJUnitRunner | tee ui.txt
            if ! grep -F 'OK (1 test)' ui.txt; then python3 -c 'import pathlib; t=pathlib.Path("ui.txt").read_text(); print("::error title=Settings UI isolated failure::"+t[-3500:].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FPRO-settings-isolated-evidence
          path: ui.txt
