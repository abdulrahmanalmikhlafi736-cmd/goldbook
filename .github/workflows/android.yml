name: Android APK
on:
  push:
    paths: ['app/**', 'device-tests/**', 'tools/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'device-tests/**', 'tools/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (without obsolete tools package)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test injected page tools
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          node --check app/src/main/assets/facebook.js
          node tools/test-injection.cjs
          node tools/test-browsing.cjs
          node tools/test-interaction.cjs
          node tools/test-selection43.cjs
          node tools/test-app-prompts45.cjs
          node tools/test-app-banners46.cjs
          node tools/test-app-reels47.cjs
      - name: Test, lint and build debug APK
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleCompact --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
            exit 0
          fi
          # Surface actionable diagnostics in the Checks API as well as raw logs.
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'gradle-build.log').read_text().splitlines()
          relevant = [line for line in lines if line.startswith(('e: ', '> ', '* What went wrong:', 'Execution failed', 'Could not ')) or ' Error:' in line]
          relevant = [line for line in relevant if not line.startswith('> Task') ]
          for line in (relevant or lines[-25:])[:40]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Android build::{escaped}')
          PY
          exit 1
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FPRO-0.0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload compact APK
        uses: actions/upload-artifact@v4
        with:
          name: FPRO-0.0.1-compact
          path: app/build/outputs/apk/compact/app-compact.apk
          if-no-files-found: error
